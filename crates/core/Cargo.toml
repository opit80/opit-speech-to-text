[package]
name = "opit-core"
description = "Core dictation logic for Opit Speech to Text: audio prep, provider client, rules, history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
url = "2"
symphonia = { version = "0.6.1", features = ["all"] }
flacenc.workspace = true
hound.workspace = true
httpdate = "1.0.3"
indexmap.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde-saphyr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
claxon.workspace = true
tempfile.workspace = true
wiremock.workspace = true
