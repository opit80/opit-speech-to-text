[package]
name = "opit-speech-to-text"
description = "Opit Speech to Text: Windows dictation app (Tauri shell, platform layer, dictation controller)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "opit_app"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
reqwest.workspace = true
sha2 = "0.10.9"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.4"
dirs.workspace = true
hound.workspace = true
opit-core = { path = "../core" }
opit-ipc = { path = "../ipc" }
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
cpal.workspace = true
keyring-core.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-native-keyring-store.workspace = true
windows-registry.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal.workspace = true
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
futures-util = "0.3"
libc = "0.2"
reis = { version = "0.7.1", features = ["tokio"] }
x11rb = { version = "0.14.0", features = ["xtest", "shape", "xkb"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
