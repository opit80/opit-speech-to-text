<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" aria-label="Opit Speech to Text. Press a shortcut, speak, and your words land at the cursor. A recording overlay with a timer and waveform previews the words as they are typed into a text field.">
<title id="t">Opit Speech to Text</title>
<desc id="d">Press a shortcut. Speak. Your words land at the cursor. On the right, the recording overlay shows a busy dot, a 0:07 timer and a 25-bar microphone waveform while the live preview of the words flows into a text field ending in a caret.</desc>
