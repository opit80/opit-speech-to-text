name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  commit-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if git log --format='%an <%ae>%n%cn <%ce>%n%B' HEAD | grep -iE 'co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|^claude |codex/'; then
            echo "::error::Disallowed text found in commit history"
            exit 1
          fi

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Install Linux app build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libgtk-layer-shell-dev patchelf libasound2-dev libgtk-layer-shell-dev
      - name: Clippy (full workspace on both platforms)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (full workspace on both platforms)
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Linux UI assets
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build the Linux app
        if: runner.os == 'Linux'
        run: cargo build --locked -p opit-speech-to-text

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/release/*.test.mjs
