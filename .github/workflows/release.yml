name: Release

# Pushing a tag vX.Y.Z builds the signed NSIS installer and the updater manifest and attaches
# them to a DRAFT GitHub Release. Nothing reaches users until a person runs
# docs/RELEASE-CHECKLIST.md and publishes the draft (releases/latest ignores drafts).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      OPIT_RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check the tag against the app version
        run: node scripts/release/latest-json.mjs check-version "$env:OPIT_RELEASE_TAG"
      - name: Refuse to rebuild a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/draft-release.mjs check "$env:OPIT_RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Install the Tauri CLI (same version as the tauri crate)
        run: cargo install tauri-cli --version 2.12.0 --locked
      - name: Test
        run: cargo test --workspace
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check and test the UI
        working-directory: ui
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release helpers
        run: node --test scripts/release/*.test.mjs
      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --ci
      - name: Prepare the release assets and latest.json
        run: node scripts/release/latest-json.mjs assets "$env:OPIT_RELEASE_TAG" target/release/bundle/nsis release-assets
      - name: Verify installer signature, signed version, manifest and checksums
        run: node scripts/release/latest-json.mjs verify "$env:OPIT_RELEASE_TAG" release-assets
      - name: Test actual updater downloads without installing
        env:
          OPIT_RELEASE_ASSETS: ${{ github.workspace }}/release-assets
        run: cargo test -p opit-speech-to-text --test updater_artifacts -- --ignored
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/draft-release.mjs upload "$env:OPIT_RELEASE_TAG" release-assets
